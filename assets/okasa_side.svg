<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="hairGradSide" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#1E1B6B"/>
      <stop offset="100%" stop-color="#2EC4B6"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#0F172A" />
  <g transform="translate(40,40)">
    <!-- body side silhouette -->
    <path d="M120,220 Q110,140 110,100 Q110,60 150,30 Q190,10 220,30 Q260,60 260,100 Q260,140 250,220 Z" fill="#0F172A"/>

    <!-- sash -->
    <rect x="120" y="130" width="120" height="18" rx="6" fill="#1E1B6B" transform="rotate(-10 160 140)" />

    <!-- head side (layered) -->
    <g id="head-side" transform="translate(170,70)">
      <!-- face base + subtle shading -->
      <path d="M0,0 C-36,-6 -60,10 -64,40 C-66,60 -52,80 -20,88 C10,80 28,60 34,44 C40,28 28,8 0,0 Z" fill="#FFEFD5" />
      <path d="M4,36 q-8 6 -6 12" stroke="#000" stroke-opacity="0.04" stroke-width="10" fill="none" />

      <!-- hair back -->
      <g id="hair-side-back">
        <path d="M-30,-6 C-50,10 -60,46 -36,78 C-20,98 8,110 36,100 C20,66 -2,34 -30,-6 Z" fill="url(#hairGradSide)"/>
        <path d="M-18,36 C-4,60 8,78 34,86" fill="none" stroke="#2EC4B6" stroke-opacity="0.18" stroke-width="3"/>
      </g>

      <!-- hair fringe at face -->
      <path d="M-12,4 C-18,18 -6,26 -4,42" fill="none" stroke="url(#hairGradSide)" stroke-width="8" stroke-linecap="round" stroke-opacity="0.98"/>

      <!-- thin circlet -->
      <path d="M-22,0 q22 -10 44 0" stroke="#FFD166" stroke-width="1.2" fill="none" stroke-opacity="0.9" />

      <!-- eye (side, layered) -->
      <g id="eye-side" transform="translate(-6,28)">
        <ellipse cx="0" cy="0" rx="10" ry="6" fill="#2C2C2C" />
        <ellipse cx="0" cy="0" rx="9" ry="5" fill="#FFD166" />
        <circle cx="-2" cy="-1" r="1.8" fill="#fff" opacity="0.95" />
      </g>

      <!-- crescent behind ear (birthmark) -->
      <path d="M-46,44 C-36,38 -24,38 -16,44" fill="#A0E7E5" opacity="0.16" filter="url(#softGlow)" />
    </g>

    <!-- fox charm hanging -->
    <g transform="translate(263,178)">
      <circle r="8" fill="#FF6B6B"/>
      <path d="M-4,-1 Q0,6 4,-1 Q0,2 -4,-1 Z" fill="#fff" />
    </g>
  </g>
</svg>
